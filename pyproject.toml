[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookmemory"
version = "0.2.0"
description = "CaptainCook4D procedural-memory hackathon build with evaluation harness and policy loop"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
atlas = ["pymongo>=4.6,<5", "dnspython>=2.6,<3"]

[project.scripts]
cookmemory = "cookmemory.cli:main"
recursive-harness = "loop:main"

[tool.setuptools]
py-modules = ["architectures", "budget", "contracts", "db", "demo", "loop", "providers", "runtime"]

[tool.setuptools.packages.find]
include = ["cookmemory*", "sim*", "evolver*", "eval*", "skills*", "viz*"]
