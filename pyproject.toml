[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robologue"
version = "0.1.0"
description = "Robologue: a dialogue for robots - persistent procedural-memory harness"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
atlas = ["pymongo>=4.6,<5", "dnspython>=2.6,<3"]
video = ["pillow>=10,<13", "numpy>=1.26,<3"]

[project.scripts]
robologue = "robologue.cli:main"

[tool.setuptools.packages.find]
include = ["robologue*"]
