[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robologue"
version = "0.1.0"
description = "CaptainCook4D procedural-memory hackathon starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
atlas = ["pymongo[srv]>=4.6,<5"]

[project.scripts]
robologue = "robologue.cli:main"

[tool.setuptools.packages.find]
include = ["robologue*"]
